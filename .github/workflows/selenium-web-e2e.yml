name: Selenium Web E2E Testing Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  selenium-web-e2e:
    name: Selenium Web E2E Tests (Chrome & Headless)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Setup Google Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Run Selenium Web E2E Suite
        env:
          HEADLESS: "true"
          BROWSER: "chrome"
          BASE_URL: ${{ vars.WEB_BASE_URL || 'https://archana-06.github.io/Vortura' }}
          API_BASE_URL: ${{ vars.API_BASE_URL || 'https://vortura-backend.onrender.com' }}
          TEST_VOTER_ID: ${{ secrets.TEST_VOTER_ID || 'TN2026002' }}
          TEST_VOTER_EMAIL: ${{ secrets.TEST_VOTER_EMAIL || 'voter@example.com' }}
        run: |
          cd frontend
          npm run test:e2e:web:report

      - name: Upload Selenium Artifacts & Excel Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Selenium_E2E_Report
          path: |
            frontend/selenium-tests/excel/Selenium_E2E_Report.xlsx
            frontend/selenium-tests/excel/E2E_Report.xlsx
            frontend/selenium-tests/reports/
            frontend/selenium-tests/screenshots/
            frontend/selenium-tests/logs/
