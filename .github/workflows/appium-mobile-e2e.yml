name: Appium Mobile E2E Testing Pipeline

on:
  workflow_dispatch:
  push:
    paths:
      - 'VorturaMobile/**'
  pull_request:
    paths:
      - 'VorturaMobile/**'

jobs:
  appium-mobile-e2e:
    name: Appium Android E2E Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Appium & UiAutomator2 Driver
        run: |
          npm install -g appium
          appium driver install uiautomator2

      - name: Install Mobile Dependencies
        run: |
          cd VorturaMobile
          npm install

      - name: Run Appium Mobile Suite
        run: |
          cd VorturaMobile
          npm run test:appium:report

      - name: Upload Appium Artifacts & Excel Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Appium_E2E_Report
          path: |
            VorturaMobile/appium-tests/excel/Appium_E2E_Report.xlsx
            VorturaMobile/appium-tests/reports/
            VorturaMobile/appium-tests/screenshots/
            VorturaMobile/appium-tests/logs/
